[package]
edition = "2021"
name = "bot"
version = "0.1.0"

[dependencies]
alloy = {version = "0.7.3", features = ["full"]}
alloy-contract = "0.7.3"
async-trait = "0.1"
bigdecimal = {version = "0.4", features = ["serde"]}
chrono = "0.4"
config = "0.14"
dotenv = "0.15"
eyre = "0.6"
futures = "0.3"
futures-util = "0.3.28"
governor = "0.8"
once_cell = "1"
serde = "1.0"
serde_json = "1"
sqlx = {version = "0.8", features = ["postgres", "bigdecimal", "time", "runtime-tokio-native-tls", "migrate"]}
time = "0.3"
tokio = {version = "1.41.1", features = ["full"]}
tokio-tungstenite = "0.24"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.dev.package."*"]
debug = false

[profile.dev]
debug = true
opt-level = 0
