[package]
edition = "2024"
name = "aave_bot"
version = "0.1.0"

[dependencies]
alloy = { version = "0.14", features = ["full"] }
alloy-contract = "0.14"
crossbeam-queue = "0.3"
hashbrown = "0.15"
chrono = "0.4"
config = "0.15"
dashmap = "6.1"
dotenv = "0.15"
eyre = "0.6"
color-eyre = "0.6"
thiserror = "2"
futures = "0.3"
futures-util = "0.3.28"
governor = "0.10"
num-bigint = "0.4"
serde = "1.0"
serde_json = "1"
sqlx = { version = "0.8", features = [
  "postgres",
  "time",
  "runtime-tokio-native-tls",
  "migrate",
  "bigdecimal",
] }
time = "0.3"
tokio = { version = "1.44.1", features = ["full"] }
tokio-tungstenite = "0.26"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.dev.package."*"]
debug = false

[profile.dev]
debug = true
opt-level = 0
